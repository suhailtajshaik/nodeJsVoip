<!DOCTYPE html>
<html>

<head>
	<meta charset='utf-8'>
	<title>NodeVoip</title>
	<script type="text/javascript" src="./js/config.js"></script>
	<script type="text/javascript" src="./js/socket.io.js"></script>
	<script type="text/javascript" src="./js/voip.js"></script>
	<script type="text/javascript" src="./js/main.js"></script>

	<link rel="stylesheet" href="./css/main.css">
</head>

<body>
	<h1>NodeJsVoip</h1>
	<button id="startBtn">Start Talking</button>
	<span style="margin-left: 20px;">Connected clients: <span id="clients"></span></span>

	<div style="margin: 20px 0; padding: 10px; background: #f0f0f0; border-radius: 5px;">
		<h3 style="margin-top: 0;">Audio Quality Settings</h3>
		<p style="margin: 5px 0;">
			<strong>Sample Rate:</strong> <span id="sampleRate"></span> Hz |
			<strong>Bit Depth:</strong> <span id="bitRate"></span>-bit |
			<strong>Chunk Size:</strong> <span id="chunkSize"></span> samples
		</p>
		<p style="margin: 5px 0; font-size: 12px; color: #666;">
			💡 To change settings, edit <code>webcontent/js/config.js</code> and reload the page
		</p>
	</div>

	<b>Mic audio</b><br>
	<canvas style="border: 1px solid;" id="micaudio" width="1024" height="200"></canvas><br>

	<b>Incoming audio</b><br>
	<canvas style="border: 1px solid;" id="incaudio" width="1024" height="200"></canvas>
</body>

</html>
